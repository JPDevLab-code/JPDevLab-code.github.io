<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — UltraPDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .logo { margin-bottom: 1.5rem; }
        .logo svg { height: 32px; }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #fff; }
        .subtitle { font-size: 0.875rem; color: #888; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 500;
            margin-bottom: 0.35rem; color: #aaa;
        }
        .form-group input {
            width: 100%; padding: 0.65rem 0.75rem; border-radius: 8px;
            border: 1px solid #444; background: #222; color: #fff;
            font-size: 0.9rem; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #646cff; }
        .btn {
            width: 100%; padding: 0.7rem; border: none; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn-primary { background: #646cff; color: #fff; }
        .btn-primary:hover { background: #535bf2; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: #ff6b6b; font-size: 0.8rem; margin-top: 0.5rem; display: none; }
        .success { display: none; }
        .success .icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: #2b8a3e; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 1rem;
        }
        .success .icon span { font-size: 2rem; }
        .success h2 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #fff; }
        .success p { font-size: 0.85rem; color: #888; line-height: 1.5; }
        .error-page { display: none; }
        .error-page h2 { color: #ff6b6b; margin-bottom: 0.5rem; }
        .error-page p { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div id="resetForm">
            <div class="logo">
                <svg viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="30" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">UltraPDF</text>
                </svg>
            </div>
            <h1 id="formTitle"></h1>
            <p class="subtitle" id="formSubtitle"></p>

            <form id="passwordForm" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label for="newPassword" id="labelNew"></label>
                    <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword" id="labelConfirm"></label>
                    <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
                </div>
                <div id="errorMsg" class="error"></div>
                <button type="submit" class="btn btn-primary" id="submitBtn"></button>
            </form>
        </div>

        <div id="successState" class="success">
            <div class="icon"><span>&#10003;</span></div>
            <h2 id="successTitle"></h2>
            <p id="successMsg"></p>
        </div>

        <div id="errorState" class="error-page">
            <div class="logo">
                <svg viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="30" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">UltraPDF</text>
                </svg>
            </div>
            <h2 id="errorTitle"></h2>
            <p id="errorMsgPage"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://llzemgxuskdhiffnsvdc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_S1veirlDARE9flheSmda8Q_diDnH3tZ';

        const lang = navigator.language.startsWith('es') ? 'es' : 'en';
        const s = {
            es: {
                title: 'Restablecer contrase\u00f1a',
                subtitle: 'Ingresa tu nueva contrase\u00f1a',
                labelNew: 'Nueva contrase\u00f1a',
                labelConfirm: 'Confirmar contrase\u00f1a',
                placeholderNew: 'M\u00ednimo 6 caracteres',
                placeholderConfirm: 'Repite tu contrase\u00f1a',
                submitBtn: 'Cambiar contrase\u00f1a',
                submitting: 'Cambiando...',
                successTitle: 'Contrase\u00f1a actualizada',
                successMsg: 'Abre UltraPDF e inicia sesi\u00f3n con tu nueva contrase\u00f1a.',
                errorTitle: 'Enlace no v\u00e1lido',
                errorMsg: 'Este enlace de restablecimiento ha expirado o no es v\u00e1lido. Solicita uno nuevo desde la aplicaci\u00f3n.',
                mismatch: 'Las contrase\u00f1as no coinciden.',
                tooShort: 'La contrase\u00f1a debe tener al menos 6 caracteres.',
                genericError: 'Error al cambiar la contrase\u00f1a. El enlace puede haber expirado.'
            },
            en: {
                title: 'Reset your password',
                subtitle: 'Enter your new password',
                labelNew: 'New password',
                labelConfirm: 'Confirm password',
                placeholderNew: 'Minimum 6 characters',
                placeholderConfirm: 'Repeat your password',
                submitBtn: 'Reset password',
                submitting: 'Resetting...',
                successTitle: 'Password updated',
                successMsg: 'Open UltraPDF and sign in with your new password.',
                errorTitle: 'Invalid link',
                errorMsg: 'This reset link has expired or is invalid. Request a new one from the app.',
                mismatch: 'Passwords do not match.',
                tooShort: 'Password must be at least 6 characters.',
                genericError: 'Failed to reset password. The link may have expired.'
            }
        }[lang] || { title: 'Reset your password', subtitle: 'Enter your new password', labelNew: 'New password', labelConfirm: 'Confirm password', placeholderNew: 'Minimum 6 characters', placeholderConfirm: 'Repeat your password', submitBtn: 'Reset password', submitting: 'Resetting...', successTitle: 'Password updated', successMsg: 'Open UltraPDF and sign in with your new password.', errorTitle: 'Invalid link', errorMsg: 'This reset link has expired or is invalid. Request a new one from the app.', mismatch: 'Passwords do not match.', tooShort: 'Password must be at least 6 characters.', genericError: 'Failed to reset password. The link may have expired.' };

        document.documentElement.lang = lang;
        document.getElementById('formTitle').textContent = s.title;
        document.getElementById('formSubtitle').textContent = s.subtitle;
        document.getElementById('labelNew').textContent = s.labelNew;
        document.getElementById('labelConfirm').textContent = s.labelConfirm;
        document.getElementById('newPassword').placeholder = s.placeholderNew;
        document.getElementById('confirmPassword').placeholder = s.placeholderConfirm;
        document.getElementById('submitBtn').textContent = s.submitBtn;
        document.getElementById('successTitle').textContent = s.successTitle;
        document.getElementById('successMsg').textContent = s.successMsg;
        document.getElementById('errorTitle').textContent = s.errorTitle;
        document.getElementById('errorMsgPage').textContent = s.errorMsg;
        document.title = s.title + ' \u2014 UltraPDF';

        function getTokenFromHash() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return params.get('access_token') || params.get('token');
        }

        const token = getTokenFromHash();

        if (!token) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }

        async function handleReset(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.style.display = 'none';

            if (newPass !== confirmPass) {
                errorMsg.textContent = s.mismatch;
                errorMsg.style.display = 'block';
                return;
            }

            if (newPass.length < 6) {
                errorMsg.textContent = s.tooShort;
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = s.submitting;

            try {
                const response = await fetch(SUPABASE_URL + '/auth/v1/user', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                        'apikey': SUPABASE_KEY
                    },
                    body: JSON.stringify({ password: newPass })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error_description || data.msg || s.genericError);
                }

                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successState').style.display = 'block';
            } catch (err) {
                errorMsg.textContent = err.message || s.genericError;
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = s.submitBtn;
            }
        }
    </script>
</body>
</html>
