<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña — UltraPDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .logo { margin-bottom: 1.5rem; }
        .logo svg { height: 32px; }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #fff; }
        .subtitle { font-size: 0.875rem; color: #888; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 500;
            margin-bottom: 0.35rem; color: #aaa;
        }
        .form-group input {
            width: 100%; padding: 0.65rem 0.75rem; border-radius: 8px;
            border: 1px solid #444; background: #222; color: #fff;
            font-size: 0.9rem; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #646cff; }
        .btn {
            width: 100%; padding: 0.7rem; border: none; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn-primary { background: #646cff; color: #fff; }
        .btn-primary:hover { background: #535bf2; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: #ff6b6b; font-size: 0.8rem; margin-top: 0.5rem; display: none; }
        .success { display: none; }
        .success .icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: #2b8a3e; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 1rem;
        }
        .success .icon span { font-size: 2rem; }
        .success h2 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #fff; }
        .success p { font-size: 0.85rem; color: #888; line-height: 1.5; }
        .error-page { display: none; }
        .error-page h2 { color: #ff6b6b; margin-bottom: 0.5rem; }
        .error-page p { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
        .link { color: #646cff; text-decoration: none; font-weight: 500; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Password Reset Form -->
        <div id="resetForm">
            <div class="logo">
                <svg viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="30" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">UltraPDF</text>
                </svg>
            </div>
            <h1>Restablecer contraseña</h1>
            <p class="subtitle">Ingresa tu nueva contraseña</p>

            <form id="passwordForm" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label for="newPassword">Nueva contraseña</label>
                    <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required minlength="6" autocomplete="new-password">
                </div>
                <div id="errorMsg" class="error"></div>
                <button type="submit" class="btn btn-primary" id="submitBtn">Cambiar contraseña</button>
            </form>
        </div>

        <!-- Success State -->
        <div id="successState" class="success">
            <div class="icon"><span>&#10003;</span></div>
            <h2>Contraseña actualizada</h2>
            <p>Abre UltraPDF e inicia sesión con tu nueva contraseña.</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="error-page">
            <div class="logo">
                <svg viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="30" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">UltraPDF</text>
                </svg>
            </div>
            <h2>Enlace no válido</h2>
            <p>Este enlace de restablecimiento ha expirado o no es válido. Solicita uno nuevo desde la aplicación.</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://llzemgxuskdhiffnsvdc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_S1veirlDARE9flheSmda8Q_diDnH3tZ';

        // Extract token from URL hash fragment
        function getTokenFromHash() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return params.get('access_token') || params.get('token');
        }

        const token = getTokenFromHash();

        if (!token) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }

        async function handleReset(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.style.display = 'none';

            if (newPass !== confirmPass) {
                errorMsg.textContent = 'Las contraseñas no coinciden.';
                errorMsg.style.display = 'block';
                return;
            }

            if (newPass.length < 6) {
                errorMsg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Cambiando...';

            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'apikey': SUPABASE_KEY
                    },
                    body: JSON.stringify({ password: newPass })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error_description || data.msg || 'Error al cambiar la contraseña');
                }

                // Success
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successState').style.display = 'block';
            } catch (err) {
                errorMsg.textContent = err.message || 'Error al cambiar la contraseña. El enlace puede haber expirado.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Cambiar contraseña';
            }
        }
    </script>
</body>
</html>
