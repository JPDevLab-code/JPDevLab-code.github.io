<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Verificada — UltraPDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .logo { margin-bottom: 1.5rem; }
        .logo svg { height: 32px; }
        .icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: #2b8a3e; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 1rem;
        }
        .icon span { font-size: 2rem; color: #fff; }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #fff; }
        .subtitle { font-size: 0.875rem; color: #888; margin-bottom: 1.5rem; line-height: 1.5; }
        .btn {
            display: inline-block; padding: 0.7rem 1.5rem; border: none; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: background 0.2s;
        }
        .btn-primary { background: #646cff; color: #fff; }
        .btn-primary:hover { background: #535bf2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="0" y="30" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">UltraPDF</text>
            </svg>
        </div>
        <div class="icon"><span>&#10003;</span></div>
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <a href="javascript:void(0)" onclick="try{window.location='ultrapdf://'}catch(e){}" class="btn btn-primary" id="openBtn"></a>
    </div>

    <script>
        const lang = navigator.language.startsWith('es') ? 'es' : 'en';
        const s = {
            es: {
                title: 'Cuenta verificada',
                subtitle: 'Tu cuenta ha sido verificada correctamente.<br>Ahora abre <strong>UltraPDF</strong> e inicia sesi\u00f3n.',
                openBtn: 'Abrir UltraPDF'
            },
            en: {
                title: 'Account verified',
                subtitle: 'Your account has been verified successfully.<br>Now open <strong>UltraPDF</strong> and sign in.',
                openBtn: 'Open UltraPDF'
            }
        }[lang] || { title: 'Account verified', subtitle: 'Your account has been verified successfully.<br>Now open <strong>UltraPDF</strong> and sign in.', openBtn: 'Open UltraPDF' };

        document.documentElement.lang = lang;
        document.getElementById('title').textContent = s.title;
        document.getElementById('subtitle').innerHTML = s.subtitle;
        document.getElementById('openBtn').textContent = s.openBtn;
        document.title = s.title + ' \u2014 UltraPDF';
    </script>
</body>
</html>
